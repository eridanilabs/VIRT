name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    # Xcode 27 (the iOS 27 SDK) is only on the preview image so far: actions/runner-images#14404.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: ./scripts/test.sh
